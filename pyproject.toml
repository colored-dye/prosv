[project]
name = "prosv"
version = "0.1.0"
description = "Prompt-only steering vector."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.1",
    "datasets>=4.5.0",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "loguru>=0.7.3",
    "pyreft>=0.0.7",
    "torch>=2.10.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
