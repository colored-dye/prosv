[project]
name = "reft"
version = "0.1.0"
description = "Parameter-efficient fine-tuning (PEFT), representation fine-tuning (ReFT) and steering vector (SV)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.11.0",
    "bitsandbytes>=0.48.2",
    "datasets>=4.4.1",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "loguru>=0.7.3",
    "matplotlib>=3.10.7",
    "openai>=2.7.1",
    "plotnine>=0.15.1",
    "sentencepiece>=0.2.1",
    "torch>=2.9.0",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "transformers>=4.57.1,<5.0",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"
